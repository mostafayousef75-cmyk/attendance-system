<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة إدارة مواعيد وأبديتات الكول سنتر</title>
    <!-- Tailwind CSS للتصميم السريع والجميل -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Header & Search -->
    <header class="bg-blue-600 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-bold">🏥 نظام الكول سنتر - مواعيد ماجستي والخدمات</h1>
            <div class="w-full md:w-1/3">
                <input type="text" id="globalSearch" placeholder="بحث سريع عن طبيب، خدمة، فرع، أو تنبيه..." 
                    class="w-full px-4 py-2 rounded-lg text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="bg-white shadow border-b">
        <div class="container mx-auto px-4 flex overflow-x-auto gap-2 py-2">
            <button onclick="switchTab('updates')" class="tab-btn px-4 py-2 rounded-lg font-semibold bg-blue-600 text-white whitespace-nowrap">📢 التنبيهات والأبديتات</button>
            <button onclick="switchTab('tab1')" class="tab-btn px-4 py-2 rounded-lg font-semibold text-gray-600 hover:bg-gray-100 whitespace-nowrap">الواجهة</button>
            <button onclick="switchTab('tab2')" class="tab-btn px-4 py-2 rounded-lg font-semibold text-gray-600 hover:bg-gray-100 whitespace-nowrap">الأقسام والخدمات</button>
            <button onclick="switchTab('tab3')" class="tab-btn px-4 py-2 rounded-lg font-semibold text-gray-600 hover:bg-gray-100 whitespace-nowrap">دوام الأطباء</button>
            <button onclick="switchTab('tab4')" class="tab-btn px-4 py-2 rounded-lg font-semibold text-gray-600 hover:bg-gray-100 whitespace-nowrap">العروض</button>
            <button onclick="switchTab('tab5')" class="tab-btn px-4 py-2 rounded-lg font-semibold text-gray-600 hover:bg-gray-100 whitespace-nowrap">الاستفسارات</button>
            <button onclick="switchTab('tab6')" class="tab-btn px-4 py-2 rounded-lg font-semibold text-gray-600 hover:bg-gray-100 whitespace-nowrap">المنسقين</button>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container mx-auto px-4 py-6">

        <!-- Updates / Announcements Section -->
        <section id="section-updates" class="space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h2 class="text-lg font-bold mb-4 text-blue-600">➕ إضافة تحديث أو تنبيه جديد</h2>
                <form id="updateForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">عنوان التنبيه / التحديث</label>
                        <input type="text" id="upTitle" required class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-400">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">التفاصيل والملاحظات</label>
                        <textarea id="upDesc" rows="3" required class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-400"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">إرفاق صورة أو ملف (اختياري)</label>
                        <input type="file" id="upFile" class="w-full border rounded-lg px-3 py-2 bg-gray-50">
                    </div>
                    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-blue-700">نشر التنبيه</button>
                </form>
            </div>

            <!-- Feed -->
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h2 class="text-lg font-bold mb-4">📜 سجل التنبيهات والأبديتات الحالية</h2>
                <div id="updatesList" class="space-y-4">
                    <!-- Dynamic Items -->
                </div>
            </div>
        </section>

        <!-- Sheets Content Section (Tabs 1 to 6) -->
        <section id="section-sheets" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-md flex justify-between items-center">
                <h2 id="currentTabTitle" class="text-xl font-bold text-blue-600">اسم الصفحة</h2>
                <button onclick="saveCurrentSheetData()" class="bg-green-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-green-700">💾 حفظ التعديلات</button>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-md overflow-x-auto">
                <textarea id="sheetEditor" rows="12" class="w-full font-mono text-sm border rounded-lg p-3 focus:ring-2 focus:ring-blue-400" placeholder="يمكنك تعديل بيانات هذه الصفحة مباشرة هنا..."></textarea>
            </div>
        </section>

    </main>

    <!-- Firebase Configuration & Logic -->
    <script>
        // إعدادات جافاسكريبت للاتصال بـ Firebase Realtime Database الخاصة بك
        const firebaseConfig = {
            databaseURL: "https://monasqen-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let activeTab = 'updates';

        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('text-gray-600', 'hover:bg-gray-100');
            });
            event.target.classList.add('bg-blue-600', 'text-white');
            event.target.classList.remove('text-gray-600', 'hover:bg-gray-100');

            if(tab === 'updates') {
                document.getElementById('section-updates').classList.remove('hidden');
                document.getElementById('section-sheets').classList.add('hidden');
                loadUpdates();
            } else {
                document.getElementById('section-updates').classList.add('hidden');
                document.getElementById('section-sheets').classList.remove('hidden');
                loadSheetData(tab);
            }
        }

        // تحميل وتخزين التنبيهات
        const updateForm = document.getElementById('updateForm');
        updateForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('upTitle').value;
            const desc = document.getElementById('upDesc').value;
            const fileInput = document.getElementById('upFile');
            
            const newUpdateRef = db.ref('updates').push();
            
            if(fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function(event) {
                    newUpdateRef.set({
                        title: title,
                        desc: desc,
                        fileData: event.target.result,
                        fileName: file.name,
                        timestamp: Date.now()
                    }, () => {
                        updateForm.reset();
                        loadUpdates();
                    });
                };
                reader.readAsDataURL(file);
            } else {
                newUpdateRef.set({
                    title: title,
                    desc: desc,
                    fileData: null,
                    fileName: null,
                    timestamp: Date.now()
                }, () => {
                    updateForm.reset();
                    loadUpdates();
                });
            }
        });

        function loadUpdates() {
            db.ref('updates').on('value', (snapshot) => {
                const list = document.getElementById('updatesList');
                list.innerHTML = '';
                const data = snapshot.val();
                if(!data) {
                    list.innerHTML = '<p class="text-gray-500">لا توجد تنبيهات حالياً.</p>';
                    return;
                }
                Object.keys(data).reverse().forEach(key => {
                    const item = data[key];
                    let fileHtml = item.fileName ? `<div class="mt-2"><a href="${item.fileData}" download="${item.fileName}" class="text-blue-500 underline text-sm">📎 تنزيل الملف المرفق: ${item.fileName}</a></div>` : '';
                    
                    list.innerHTML += `
                        <div class="border p-4 rounded-lg bg-gray-50 relative">
                            <h3 class="font-bold text-lg text-blue-700">${item.title}</h3>
                            <p class="text-gray-700 mt-1 whitespace-pre-line">${item.desc}</p>
                            ${fileHtml}
                            <div class="flex justify-between items-center mt-3 text-xs text-gray-400">
                                <span>${new Date(item.timestamp).toLocaleString('ar-EG')}</span>
                                <button onclick="deleteUpdate('${key}')" class="text-red-500 hover:text-red-700 font-bold">🗑️ حذف</button>
                            </div>
                        </div>
                    `;
                });
            });
        }

        function deleteUpdate(key) {
            if(confirm('هل أنت متأكد من حذف هذا التنبيه؟')) {
                db.ref('updates/' + key).remove();
            }
        }

        // إدارة صفحات الشيت الـ 6
        const tabNames = {
            'tab1': 'الواجهة',
            'tab2': 'الأقسام والخدمات',
            'tab3': 'دوام الأطباء',
            'tab4': 'العروض',
            'tab5': 'الاستفسارات',
            'tab6': 'المنسقين'
        };

        function loadSheetData(tabKey) {
            document.getElementById('currentTabTitle').innerText = tabNames[tabKey];
            db.ref('sheets/' + tabKey).once('value', (snapshot) => {
                document.getElementById('sheetEditor').value = snapshot.val() || '';
            });
        }

        function saveCurrentSheetData() {
            const content = document.getElementById('sheetEditor').value;
            db.ref('sheets/' + activeTab).set(content, () => {
                alert('✅ تم حفظ التعديلات بنجاح في السحابة!');
            });
        }

        // محرك البحث العام (يبحث في التنبيهات ومحتوى الشيتات)
        document.getElementById('globalSearch').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            if(!query) return;
            // يمكن توسيع البحث حسب الرغبة
        });

        // التشغيل الأولي
        loadUpdates();
    </script>
</body>
</html>
