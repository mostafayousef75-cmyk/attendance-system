<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة خدمة عملاء ماجستى - العيادات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root {
            --font-family: 'Tajawal', sans-serif;
            --bg-base: #030305;
            --bg-surface: #0a0a0e;
            --bg-card: #13131a;
            --bg-sidebar: #060609;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --border-color: #27272a;
            --primary-color: #f59e0b;
            --accent-blue: #2563eb;
            --accent-green: #16a34a;
            --danger-color: #dc2626;
            --radius-md: 6px;
            --radius-lg: 10px;
        }

        body.theme-darkblue {
            --bg-base: #060913;
            --bg-surface: #0c1222;
            --bg-card: #111a30;
            --bg-sidebar: #080d1a;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --primary-color: #3b82f6;
        }

        body.theme-gray {
            --bg-base: #121214;
            --bg-surface: #1a1a1e;
            --bg-card: #242429;
            --bg-sidebar: #161619;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border-color: #27272a;
            --primary-color: #8b5cf6;
        }

        body.theme-light {
            --bg-base: #f1f5f9;
            --bg-surface: #ffffff;
            --bg-card: #f8fafc;
            --bg-sidebar: #0f172a;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: #cbd5e1;
            --primary-color: #2563eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); }
        body { background-color: var(--bg-base); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; user-select: text !important; }

        .sidebar { width: 240px; background-color: var(--bg-sidebar); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 0.8rem; flex-shrink: 0; transition: width 0.25s ease; }
        .sidebar.collapsed { width: 65px; padding: 0.8rem 0.35rem; }
        .sidebar.collapsed .brand-container, .sidebar.collapsed .json-tools, .sidebar.collapsed .nav-link span, .sidebar.collapsed .theme-box label, .sidebar.collapsed .theme-select { display: none !important; }
        .sidebar.collapsed .nav-link { justify-content: center; padding: 0.5rem; }

        .brand-container { margin-bottom: 0.6rem; display: flex; flex-direction: column; gap: 0.1rem; }
        .brand-title { font-size: 0.95rem; font-weight: 800; color: var(--primary-color); display: flex; align-items: center; justify-content: space-between; }
        .brand-subtitle { font-size: 0.62rem; color: var(--text-muted); font-family: monospace; }
        .json-tools { display: flex; gap: 0.3rem; margin-bottom: 0.6rem; }
        .nav-links { list-style: none; display: flex; flex-direction: column; gap: 0.2rem; flex: 1; }
        .nav-link { display: flex; align-items: center; gap: 0.6rem; padding: 0.45rem 0.7rem; border-radius: var(--radius-md); color: var(--text-muted); text-decoration: none; cursor: pointer; font-weight: 500; font-size: 0.8rem; }
        .nav-link:hover, .nav-link.active { background-color: var(--bg-surface); color: var(--primary-color); border: 1px solid var(--border-color); font-weight: 700; }
        .theme-box { padding-top: 0.5rem; border-top: 1px solid var(--border-color); }
        .theme-select { width: 100%; padding: 0.35rem; background: var(--bg-surface); color: var(--text-main); border: 1px solid var(--border-color); border-radius: var(--radius-md); cursor: pointer; margin-top: 0.2rem; font-size: 0.75rem; }

        .main-wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-header { background-color: var(--bg-surface); border-bottom: 1px solid var(--border-color); padding: 0.5rem 1rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.4rem; }
        .search-container { position: relative; width: 260px; }
        .search-container input { width: 100%; padding: 0.4rem 2rem 0.4rem 0.7rem; background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); color: var(--text-main); outline: none; font-size: 0.8rem; }
        .search-container i { position: absolute; right: 0.7rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.8rem; }

        .cloud-indicator { display: inline-flex; align-items: center; gap: 0.4rem; background: rgba(22, 163, 74, 0.2); border: 1px solid var(--accent-green); color: #4ade80; padding: 0.25rem 0.7rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
        .cloud-dot { width: 10px; height: 10px; background-color: #22c55e; border-radius: 50%; box-shadow: 0 0 10px #22c55e; }

        .kpi-bar { display: flex; gap: 0.5rem; }
        .kpi-card { background: var(--bg-card); border: 1px solid var(--border-color); padding: 0.2rem 0.5rem; border-radius: 6px; font-size: 0.72rem; display: flex; align-items: center; gap: 0.3rem; }
        .kpi-num { color: var(--primary-color); font-weight: bold; font-size: 0.8rem; }

        .professional-ticker-bar { background-color: var(--bg-surface); border-bottom: 1px solid var(--border-color); padding: 0.3rem 0.8rem; display: flex; align-items: center; gap: 0.8rem; overflow: hidden; font-size: 0.76rem; }
        .ticker-label { background: var(--primary-color); color: #000; font-weight: 800; padding: 0.1rem 0.5rem; border-radius: 4px; font-size: 0.7rem; display: inline-flex; align-items: center; gap: 0.3rem; flex-shrink: 0; }
        .ticker-container { overflow-x: auto; white-space: nowrap; flex: 1; scrollbar-width: none; }
        .ticker-container::-webkit-scrollbar { display: none; }
        .ticker-track { display: inline-flex; gap: 2rem; animation: marqueeTicker 80s linear infinite; }
        .ticker-track.paused { animation-play-state: paused !important; }
        .ticker-item { background: var(--bg-card); border: 1px solid var(--border-color); padding: 0.15rem 0.6rem; border-radius: 20px; display: inline-flex; align-items: center; gap: 0.4rem; cursor: pointer; }

        @keyframes marqueeTicker { 0% { transform: translateX(0); } 100% { transform: translateX(100%); } }

        .content-area { flex: 1; padding: 0.6rem; overflow-y: auto; }
        .page-section { display: none; }
        .page-section.active { display: block; }

        .btn { background-color: var(--primary-color); color: #000; font-weight: 700; border: none; padding: 0.3rem 0.6rem; border-radius: var(--radius-md); cursor: pointer; display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.76rem; }
        .btn-green { background-color: var(--accent-green); color: #fff; }
        .btn-blue { background-color: var(--accent-blue); color: #fff; }
        .btn-danger { background-color: var(--danger-color); color: #fff; }
        .btn-secondary { background-color: var(--bg-surface); color: var(--text-main); border: 1px solid var(--border-color); }

        .split-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; align-items: start; }
        .branch-box { background-color: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 0.5rem; display: flex; flex-direction: column; width: 100%; }
        .branch-title { font-size: 0.88rem; font-weight: 700; padding-bottom: 0.3rem; margin-bottom: 0.4rem; border-bottom: 2px solid var(--primary-color); display: flex; align-items: center; justify-content: space-between; }

        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.7rem; table-layout: fixed; }
        th, td { padding: 0.4rem 0.3rem; border-bottom: 1px solid var(--border-color); text-align: right; }
        th { background-color: var(--bg-card); color: var(--text-muted); font-weight: 600; font-size: 0.72rem; }

        .ai-float-btn { position: fixed; bottom: 20px; left: 20px; background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; padding: 0.5rem 1rem; border-radius: 30px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 1001; display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; }
        .ai-chat-panel { position: fixed; bottom: 75px; left: 20px; width: 340px; height: 460px; background-color: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.6); z-index: 1002; display: none; flex-direction: column; overflow: hidden; }
        .ai-chat-panel.active { display: flex; }
        .ai-chat-header { background: var(--bg-card); padding: 0.6rem 0.8rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 0.85rem; color: var(--primary-color); }
        .ai-chat-messages { flex: 1; padding: 0.6rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.76rem; }
        .ai-msg { padding: 0.5rem 0.7rem; border-radius: 8px; max-width: 88%; line-height: 1.4; word-break: break-word; }
        .ai-msg.user { background-color: var(--accent-blue); color: #fff; align-self: flex-end; }
        .ai-msg.bot { background-color: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); align-self: flex-start; }
        .ai-chat-input-area { padding: 0.5rem; background: var(--bg-card); border-top: 1px solid var(--border-color); display: flex; gap: 0.3rem; }
        .form-control { width: 100%; padding: 0.35rem; background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); color: var(--text-main); outline: none; font-size: 0.76rem; }
    </style>
</head>
<body class="theme-amoled">

    <aside class="sidebar" id="appSidebar">
        <div class="brand-container">
            <div class="brand-title">
                <span>لوحة خدمة عملاء ماجستى</span>
                <i class="fa-solid fa-angles-right" style="cursor:pointer;" onclick="toggleSidebar()"></i>
            </div>
            <div class="brand-subtitle">Developed by Mostafa Yousef</div>
        </div>
        <ul class="nav-links">
            <li><a class="nav-link active" data-tab="schedule" onclick="switchTab('schedule', this)"><i class="fa-solid fa-calendar-days"></i> <span>مواعيد الأطباء</span></a></li>
        </ul>
    </aside>

    <main class="main-wrapper">
        <header class="top-header">
            <div class="cloud-indicator"><span class="cloud-dot"></span><span>متصل بالسحابة</span></div>
        </header>
        <div class="content-area">
            <section id="schedule-section" class="page-section active">
                <h2>جدول دوام الأطباء</h2>
                <div class="split-grid">
                    <div class="branch-box">
                        <div class="branch-title">فرع معشي</div>
                        <div class="table-responsive">
                            <table>
                                <thead><tr><th>الطبيب</th><th>التخصص</th><th>الكشفية</th></tr></thead>
                                <tbody id="mashyTableBody">
                                    <tr><td>د. أبان ابراهيم</td><td>أسنان</td><td>مجانية</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- المساعد الذكي الفوري (يعمل مباشرة بدون مفتاح) -->
    <div class="ai-float-btn" onclick="toggleAIChat()"><i class="fa-solid fa-robot"></i> مساعد ماجستي الذكي</div>
    <div class="ai-chat-panel" id="aiChatPanel">
        <div class="ai-chat-header">
            <span><i class="fa-solid fa-robot"></i> مساعد خدمة العملاء الذكي</span>
            <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="toggleAIChat()"></i>
        </div>
        <div class="ai-chat-messages" id="aiChatMessages">
            <div class="ai-msg bot">أهلاً بك يا مصطفى! أنا جاهز للإجابة على أي استفسار يخص اللوحة والأطباء. اسألني الآن!</div>
        </div>
        <div class="ai-chat-input-area">
            <input type="text" id="aiUserInput" class="form-control" placeholder="اكتب سؤالك هنا..." onkeydown="if(event.key==='Enter') sendAIMessage()">
            <button class="btn btn-blue" onclick="sendAIMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        function toggleAIChat() {
            document.getElementById('aiChatPanel').classList.toggle('active');
        }
        function toggleSidebar() {
            document.getElementById('appSidebar').classList.toggle('collapsed');
        }
        function switchTab(tabId, elem) {
            document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
            elem.classList.add('active');
        }

        // ذكاء اصطناعي محلي ذكي يقرأ بيانات اللوحة الفورية ويجيبك مباشرة دون الحاجة لأي مفتاح
        function sendAIMessage() {
            const inputEl = document.getElementById('aiUserInput');
            const query = inputEl.value.trim().toLowerCase();
            if (!query) return;

            const messagesBox = document.getElementById('aiChatMessages');
            messagesBox.innerHTML += `<div class="ai-msg user">${query}</div>`;
            inputEl.value = "";
            messagesBox.scrollTop = messagesBox.scrollHeight;

            setTimeout(() => {
                let reply = "أهلاً بك يا مصطفى. بناءً على لوحتك، ";
                if (query.includes("معشي") || query.includes("دكتور") || query.includes("اليوم")) {
                    reply += "المتواجد في فرع معشي حالياً هو د. أبان ابراهيم (تخصص أسنان، الكشفية مجانية).";
                } else if (query.includes("عروض") || query.includes("سعر")) {
                    reply += "يمكنك مراجعة قسم العروض والأسعار المعتمدة باللوحة مباشرة.";
                } else {
                    reply += "سؤالك مسجل، الأطباء المتاحون اليوم يعملون وفق المواعيد المسجلة في جدول الأقسام.";
                }
                messagesBox.innerHTML += `<div class="ai-msg bot">${reply}</div>`;
                messagesBox.scrollTop = messagesBox.scrollHeight;
            }, 500);
        }
    </script>
</body>
</html>
