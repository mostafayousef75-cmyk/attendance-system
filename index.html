​function playChirpSound() {
try {
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = 'sine';
osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08);
gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
osc.connect(gain);
gain.connect(audioCtx.destination);
osc.start();
osc.stop(audioCtx.currentTime + 0.08);
} catch(e){}
}
​let activeFloatingTagBox = null;
let activeFloatingTagOrigin = null;
​function closeFloatingTags() {
if (activeFloatingTagBox && activeFloatingTagOrigin) {
activeFloatingTagBox.classList.remove('show');
activeFloatingTagOrigin.appendChild(activeFloatingTagBox);
}
activeFloatingTagBox = null;
activeFloatingTagOrigin = null;
}
​function toggleTagsVisibility(btnEl) {
const existingBox = btnEl.parentElement.querySelector('.hidden-tags-container');
const isSameBox = (activeFloatingTagBox && !existingBox);
​closeFloatingTags();
if (isSameBox || !existingBox) return;
​activeFloatingTagOrigin = btnEl.parentElement;
activeFloatingTagBox = existingBox;
​document.body.appendChild(existingBox);
​existingBox.style.position = 'fixed';
existingBox.style.zIndex = '99999999';
existingBox.style.right = 'auto';
existingBox.style.left = 'auto';
existingBox.style.top = 'auto';
existingBox.style.bottom = 'auto';
existingBox.style.minWidth = '110px';
existingBox.style.maxWidth = '210px';
existingBox.style.width = 'max-content';
existingBox.style.padding = '0.25rem 0.45rem';
existingBox.style.borderRadius = '6px';
existingBox.style.lineHeight = '1.35';
existingBox.style.whiteSpace = 'normal';
existingBox.style.wordBreak = 'break-word';
existingBox.style.boxShadow = '0 4px 12px rgba(0,0,0,0.65)';
​const innerSpan = existingBox.querySelector('span');
if (innerSpan) {
innerSpan.style.fontSize = '0.62rem';
}
​existingBox.classList.add('show');
​const btnRect = btnEl.getBoundingClientRect();
const boxRect = existingBox.getBoundingClientRect();
const padding = 8;
​let leftPos = btnRect.right + 6;
if (leftPos + boxRect.width > window.innerWidth - padding) {
leftPos = btnRect.left - boxRect.width - 6;
}
if (leftPos < padding) {
leftPos = padding;
}
​let topPos = btnRect.top;
if (topPos + boxRect.height > window.innerHeight - padding) {
topPos = btnRect.bottom - boxRect.height;
}
if (topPos < padding) {
topPos = padding;
}
​existingBox.style.left = leftPos + 'px';
existingBox.style.top = topPos + 'px';
}

​function formatDaysSmart(daysArray) {
if (!daysArray || daysArray.length === 0) return "";
if (daysArray.length === 7) return "طوال أيام الأسبوع (السبت للجمعة)";
​let sorted = [...daysArray].sort((a, b) => standardDaysSequence.indexOf(a) - standardDaysSequence.indexOf(b));
​let isConsecutive = true;
let firstIdx = standardDaysSequence.indexOf(sorted[0]);
for (let i = 0; i < sorted.length; i++) {
if (standardDaysSequence.indexOf(sorted[i]) !== firstIdx + i) {
isConsecutive = false;

​function checkDocActiveForTimeAndDay(doc, currentDay, currentHour24) {

for (let sh of shiftsArr) {
if (sh.start === "24" || sh.end === "24") return true;
let start = parseFloat(sh.start);
let end = parseFloat(sh.end);
if (isNaN(start) || isNaN(end)) continue;
if (start <= end) { if (currentHour24 >= start && currentHour24 <= end) return true; }
else { if (currentHour24 >= start || currentHour24 <= end) return true; }
}
}
return false;
};
return checkShiftsList(doc.shift1Days, doc.shifts1) || ((doc.shiftsCount === "2") ? checkShiftsList(doc.shift2Days, doc.shifts2) : false);
}

mashyCustomOrder = ids; localStorage.setItem('mashy_custom_order', JSON.stringify(mashyCustomOrder)); renderDoctors(); playChirpSound();

}
} else if (draggedInfo.type === 'offer' && targetType === 'offer') {
let fromIdx = offersData.findIndex(o => o.id == draggedInfo.id), toIdx = offersData.findIndex(o => o.id == targetId);
if (fromIdx !== -1 && toIdx !== -1) {
const [moved] = offersData.splice(fromIdx, 1); offersData.splice(toIdx, 0, moved); syncToCloud(); playChirpSound();
}
} else if (draggedInfo.type === 'alert' && targetType === 'alert') {
let fromIdx = alertsData.findIndex(a => a.id == draggedInfo.id), toIdx = alertsData.findIndex(a => a.id == targetId);
if (fromIdx !== -1 && toIdx !== -1) {
const [moved] = alertsData.splice(fromIdx, 1); alertsData.splice(toIdx, 0, moved); syncToCloud(); playChirpSound();
}
} else if (draggedInfo.type === 'inquiry' && targetType === 'inquiry') {
let fromIdx = inquiriesData.findIndex(i => i.id == draggedInfo.id), toIdx = inquiriesData.findIndex(i => i.id == targetId);
if (fromIdx !== -1 && toIdx !== -1) {
const [moved] = inquiriesData.splice(fromIdx, 1); inquiriesData.splice(toIdx, 0, moved); syncToCloud(); playChirpSound();
}
} else if (draggedInfo.type === 'coordinator' && targetType === 'coordinator') {

const [moved] = coordinatorsData.splice(fromIdx, 1); coordinatorsData.splice(toIdx, 0, moved); syncToCloud(); playChirpSound();
}
} else if (draggedInfo.type === 'service' && targetType === 'service') {
let fromIdx = deptServicesData.findIndex(s => s.id == draggedInfo.id), toIdx = deptServicesData.findIndex(s => s.id == targetId);

const [moved] = deptServicesData.splice(fromIdx, 1); deptServicesData.splice(toIdx, 0, moved); syncToCloud(); playChirpSound();
}
} else if (draggedInfo.type === 'note' && targetType === 'note') {

​function initFloatingOffersDrag() {
const win = document.getElementById('floatingOffersWin');
const header = document.getElementById('floatingOffersHeader');
if (!win || !header) return;
let isDragging = false, offsetX = 0, offsetY = 0;
​header.addEventListener('mousedown', (e) => {
if (e.target.closest('button')) return;
isDragging = true;
const rect = win.getBoundingClientRect();
offsetX = e.clientX - rect.left;
offsetY = e.clientY - rect.top;
win.style.bottom = 'auto';
win.style.right = 'auto';
win.style.left = rect.left + 'px';
win.style.top = rect.top + 'px';
});
​document.addEventListener('mousemove', (e) => {
if (!isDragging) return;
win.style.left = Math.max(0, Math.min(window.innerWidth - win.offsetWidth, e.clientX - offsetX)) + 'px';
win.style.top = Math.max(0, Math.min(window.innerHeight - win.offsetHeight, e.clientY - offsetY)) + 'px';
});
​document.addEventListener('mouseup', () => { isDragging = false; });
}
