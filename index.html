<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة الكول سنتر والمواعيد</title>
  <!-- Bootstrap 5 RTL CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* الثيمات الأربعة المطلوبة */
    :root[data-theme="blue"] {
      --bg-main: #0B132B;
      --bg-card: #1C2541;
      --text-main: #FFFFFF;
      --accent-color: #3A86FF;
      --border-color: #3A506B;
    }
    :root[data-theme="amoled"] {
      --bg-main: #000000;
      --bg-card: #121212;
      --text-main: #FFFFFF;
      --accent-color: #00E676;
      --border-color: #272727;
    }
    :root[data-theme="charcoal"] {
      --bg-main: #18191A;
      --bg-card: #242526;
      --text-main: #E4E6EB;
      --accent-color: #4589FF;
      --border-color: #3E4042;
    }
    :root[data-theme="light"] {
      --bg-main: #F4F6F9;
      --bg-card: #FFFFFF;
      --text-main: #212529;
      --accent-color: #0D6EFD;
      --border-color: #DEE2E6;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: all 0.3s ease;
    }
    .card {
      background-color: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }
    .nav-tabs .nav-link {
      color: var(--text-main);
      border-color: var(--border-color);
    }
    .nav-tabs .nav-link.active {
      background-color: var(--accent-color);
      color: #fff;
    }
    .btn-custom {
      background-color: var(--accent-color);
      color: white;
    }
    .time-stamp {
      font-size: 0.8rem;
      opacity: 0.75;
    }
  </style>
</head>
<body>

  <!-- القائمة العلوية واختيار السيمات -->
  <nav class="navbar navbar-expand-lg border-bottom px-3 mb-4" style="background-color: var(--bg-card);">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-white" href="#"><i class="fa-solid fa-headset me-2"></i>مؤشر الأداء والمواعيد</a>
      
      <div class="d-flex align-items-center">
        <label class="me-2 text-nowrap fw-bold" for="themeSelect">السيم:</label>
        <select id="themeSelect" class="form-select form-select-sm bg-dark text-white border-secondary" onchange="changeTheme(this.value)">
          <option value="blue" selected>الأزرق الغامق</option>
          <option value="amoled">OLED الأسود (Amoled)</option>
          <option value="charcoal">الرصاصي الفحمي</option>
          <option value="light">المضيء الفاتح</option>
        </select>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4">
    <!-- شريط البحث المتقدم -->
    <div class="row mb-4">
      <div class="col-md-12">
        <div class="input-group input-group-lg">
          <span class="input-group-text bg-secondary text-white"><i class="fa-solid fa-magnifying-glass"></i></span>
          <input type="text" id="globalSearch" class="form-control" placeholder="بحث متقدم في كافة التنبيهات، المواعيد، استفسارات العملاء والمنسقين..." onkeyup="filterAllData()">
        </div>
      </div>
    </div>

    <!-- تبويبات النظام -->
    <ul class="nav nav-tabs mb-4" id="mainTabs" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" id="alerts-tab" data-bs-toggle="tab" data-bs-target="#alerts" type="button">
          <i class="fa-solid fa-bullhorn me-1"></i> التنبيهات والإشعارات العامة
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="handover-tab" data-bs-toggle="tab" data-bs-target="#handover" type="button">
          <i class="fa-solid fa-users-rectangle me-1"></i> تسليم ومتابعة العملاء
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="sheet-data-tab" data-bs-toggle="tab" data-bs-target="#sheetData" type="button">
          <i class="fa-solid fa-table me-1"></i> مواعيد الأطباء والخدمات (الشيت)
        </button>
      </li>
    </ul>

    <!-- محتوى التبويبات -->
    <div class="tab-content" id="mainTabsContent">

      <!-- 1. التنبيهات والإشعارات -->
      <div class="tab-pane fade show active" id="alerts" role="tabpanel">
        <div class="card p-3 mb-4">
          <h5 class="card-title mb-3"><i class="fa-solid fa-plus-circle me-1"></i> إضافة تنبيه جديد</h5>
          <form id="alertForm">
            <div class="row g-2">
              <div class="col-md-8">
                <textarea id="alertText" class="form-control" rows="2" placeholder="اكتب التنبيه أو المعلومة الجديدة..." required></textarea>
              </div>
              <div class="col-md-4">
                <input type="file" id="alertFile" class="form-control mb-2" accept="image/*,.pdf,.doc,.docx">
                <button type="submit" class="btn btn-custom w-100"><i class="fa-solid fa-paper-plane me-1"></i> نشر التنبيه</button>
              </div>
            </div>
          </form>
        </div>

        <div id="alertsContainer" class="d-flex flex-column gap-3">
          <!-- يتم تحميل الإشعارات والتنبيهات ديناميكياً من Firebase -->
        </div>
      </div>

      <!-- 2. تسليم ومتابعة العملاء -->
      <div class="tab-pane fade" id="handover" role="tabpanel">
        <div class="card p-3 mb-4">
          <h5 class="card-title mb-3"><i class="fa-solid fa-user-plus me-1"></i> تسليم عميل للورادية التالية</h5>
          <form id="handoverForm">
            <div class="row g-2">
              <div class="col-md-3">
                <input type="text" id="clientName" class="form-control" placeholder="اسم العميل" required>
              </div>
              <div class="col-md-3">
                <input type="text" id="clientPhone" class="form-control" placeholder="رقم الهاتف" required>
              </div>
              <div class="col-md-4">
                <input type="text" id="clientStatus" class="form-control" placeholder="تفاصيل الطلب / حالة المتابعة" required>
              </div>
              <div class="col-md-2">
                <button type="submit" class="btn btn-success w-100"><i class="fa-solid fa-floppy-disk me-1"></i> حفظ العميل</button>
              </div>
            </div>
          </form>
        </div>

        <div class="table-responsive">
          <table class="table table-dark table-hover border">
            <thead>
              <tr>
                <th>اسم العميل</th>
                <th>رقم الهاتف</th>
                <th>حالة المتابعة</th>
                <th>وقت التحديث</th>
                <th>الإجراءات</th>
              </tr>
            </thead>
            <tbody id="handoverTableBody">
              <!-- تحميل بيانات التسليم dynamic -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- 3. بيانات الشيت والمواعيد -->
      <div class="tab-pane fade" id="sheetData" role="tabpanel">
        <div class="card p-3">
          <h5><i class="fa-solid fa-calendar-check me-2"></i> جدول المواعيد والخدمات</h5>
          <p class="text-muted small">يمكنك ربط الشيت إما عبر استيراد CSV أو مزامنة حقول Google Sheets مباشرةً عبر Firebase SDK.</p>
          <div id="sheetContentContainer">
            <!-- تعرض هنا صفحات الشيت الـ 6 -->
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script>
    // 1. تهيئة Firebase باستخدام الرابط الخاص بك
    const firebaseConfig = {
      databaseURL: "https://monasqen-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. تغيير السيمات
    function changeTheme(themeName) {
      document.documentElement.setAttribute('data-theme', themeName);
      localStorage.setItem('selectedTheme', themeName);
    }
    // استرجاع السيم المحفوظ
    const savedTheme = localStorage.getItem('selectedTheme') || 'blue';
    document.getElementById('themeSelect').value = savedTheme;
    changeTheme(savedTheme);

    // 3. التعامل مع الإشعارات والتنبيهات
    const alertForm = document.getElementById('alertForm');
    alertForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = document.getElementById('alertText').value;
      const fileInput = document.getElementById('alertFile');
      const timeStamp = new Date().toLocaleString('ar-EG');

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.onload = function(evt) {
          saveAlert(text, timeStamp, evt.target.result, file.name);
        };
        reader.readAsDataURL(file);
      } else {
        saveAlert(text, timeStamp, null, null);
      }
    });

    function saveAlert(text, time, fileData, fileName) {
      db.ref('alerts').push({
        text: text,
        time: time,
        fileData: fileData || '',
        fileName: fileName || ''
      }).then(() => {
        alertForm.reset();
      });
    }

    // استماع للتنبيهات الفورية من Firebase
    db.ref('alerts').on('value', (snapshot) => {
      const container = document.getElementById('alertsContainer');
      container.innerHTML = '';
      const data = snapshot.val();
      if (data) {
        Object.keys(data).reverse().forEach(key => {
          const item = data[key];
          let fileHtml = '';
          if (item.fileData) {
            fileHtml = `<div class="mt-2">
              <a href="${item.fileData}" download="${item.fileName}" class="btn btn-sm btn-outline-info">
                <i class="fa-solid fa-paperclip me-1"></i> تحميل/عرض الملف: ${item.fileName}
              </a>
            </div>`;
          }
          container.innerHTML += `
            <div class="card p-3 border-start border-4 border-warning alert-item">
              <div class="d-flex justify-content-between align-items-start mb-2">
                <div><i class="fa-solid fa-clock me-1 text-warning"></i><span class="time-stamp">${item.time}</span></div>
                <div>
                  <button onclick="deleteAlert('${key}')" class="btn btn-danger btn-sm"><i class="fa-solid fa-trash"></i> حذف</button>
                </div>
              </div>
              <p class="mb-1 text-content">${item.text}</p>
              ${fileHtml}
            </div>
          `;
        });
      }
    });

    function deleteAlert(key) {
      if (confirm("هل أنت تأكد من حذف هذا التنبيه؟")) {
        db.ref('alerts/' + key).remove();
      }
    }

    // 4. تسليم ومتابعة العملاء
    const handoverForm = document.getElementById('handoverForm');
    handoverForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('clientName').value;
      const phone = document.getElementById('clientPhone').value;
      const status = document.getElementById('clientStatus').value;
      const timeStamp = new Date().toLocaleString('ar-EG');

      db.ref('handover').push({
        name: name,
        phone: phone,
        status: status,
        time: timeStamp
      }).then(() => handoverForm.reset());
    });

    db.ref('handover').on('value', (snapshot) => {
      const tbody = document.getElementById('handoverTableBody');
      tbody.innerHTML = '';
      const data = snapshot.val();
      if (data) {
        Object.keys(data).reverse().forEach(key => {
          const item = data[key];
          tbody.innerHTML += `
            <tr class="handover-row">
              <td>${item.name}</td>
              <td>${item.phone}</td>
              <td>${item.status}</td>
              <td><span class="badge bg-secondary">${item.time}</span></td>
              <td>
                <button onclick="deleteHandover('${key}')" class="btn btn-sm btn-danger"><i class="fa-solid fa-trash"></i></button>
              </td>
            </tr>
          `;
        });
      }
    });

    function deleteHandover(key) {
      if (confirm("هل تم إنهاء متابعة هذا العميل؟")) {
        db.ref('handover/' + key).remove();
      }
    }

    // 5. وظيفة البحث المتقدم الحي
    function filterAllData() {
      const query = document.getElementById('globalSearch').value.toLowerCase();
      
      // تصفية التنبيهات
      document.querySelectorAll('.alert-item').forEach(el => {
        const text = el.innerText.toLowerCase();
        el.style.display = text.includes(query) ? 'block' : 'none';
      });

      // تصفية صفوف تسليم العملاء
      document.querySelectorAll('.handover-row').forEach(row => {
        const text = row.innerText.toLowerCase();
        row.style.display = text.includes(query) ? '' : 'none';
      });
    }
  </script>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
