<!DOCTYPE html>

<head>

    <title>لوحة الكول سنتر والمنسقين - المساعد الذكي الشامل</title>

    <style>
        :root {
            --font-family: 'Tajawal', sans-serif;
            --bg-base: #030305;
            --bg-surface: #0a0a0e;
            --bg-card: #13131a;
            --bg-sidebar: #060609;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --border-color: #27272a;
            --primary-color: #f59e0b;
            --accent-blue: #2563eb;
            --accent-green: #16a34a;
            --danger-color: #dc2626;
            --radius-md: 6px;
            --radius-lg: 10px;
        }

        body.theme-darkblue {
            --bg-base: #060913;
            --bg-surface: #0c1222;
            --bg-card: #111a30;
            --bg-sidebar: #080d1a;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --primary-color: #3b82f6;
        }

        body.theme-gray {
            --bg-base: #121214;
            --bg-surface: #1a1a1e;
            --bg-card: #242429;
            --bg-sidebar: #161619;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border-color: #27272a;
            --primary-color: #8b5cf6;
        }

        body.theme-light {
            --bg-base: #f1f5f9;
            --bg-surface: #ffffff;
            --bg-card: #f8fafc;
            --bg-sidebar: #0f172a;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: #cbd5e1;
            --primary-color: #2563eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            user-select: text !important;
        }

        .sidebar {
            width: 240px;
            background-color: var(--bg-sidebar);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 0.8rem;
            flex-shrink: 0;
            transition: width 0.25s ease, padding 0.25s ease;
        }

        .sidebar.collapsed {
            width: 65px;
            padding: 0.8rem 0.35rem;
        }

        .sidebar.collapsed .brand-text,
        .sidebar.collapsed .json-tools,
        .sidebar.collapsed .nav-link span,
        .sidebar.collapsed .theme-box label,
        .sidebar.collapsed .theme-select {
            display: none !important;
        }

        .sidebar.collapsed .nav-link {
            justify-content: center;
            padding: 0.5rem;
        }

        .brand-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .json-tools {
            display: flex;
            gap: 0.3rem;
            margin-bottom: 0.6rem;
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            flex: 1;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.45rem 0.7rem;
            border-radius: var(--radius-md);
            color: var(--text-muted);
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.8rem;
        }

        .nav-link:hover, .nav-link.active {
            background-color: var(--bg-surface);
            color: var(--primary-color);
            border: 1px solid var(--border-color);
            font-weight: 700;
        }

        .theme-box {
            padding-top: 0.5rem;
            border-top: 1px solid var(--border-color);
        }

        .theme-select {
            width: 100%;
            padding: 0.35rem;
            background: var(--bg-surface);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            margin-top: 0.2rem;
            font-size: 0.75rem;
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-header {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .search-container {
            position: relative;
            width: 250px;
        }

        .search-container input {
            width: 100%;
            padding: 0.4rem 2rem 0.4rem 0.7rem;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-main);
            outline: none;
            font-size: 0.8rem;
        }

        .search-container i {
            position: absolute;
            right: 0.7rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .cloud-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(22, 163, 74, 0.2);
            border: 1px solid var(--accent-green);
            color: #4ade80;
            padding: 0.25rem 0.7rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .cloud-dot {
            width: 10px;
            height: 10px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
        }

        .kpi-bar {
            display: flex;
            gap: 0.5rem;
        }
        .kpi-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            font-size: 0.72rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .kpi-num {
            color: var(--primary-color);
            font-weight: bold;
            font-size: 0.8rem;
        }

        .professional-ticker-bar {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            border-top: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 0.76rem;
        }
        .ticker-label {
            background: var(--primary-color);
            color: #000;
            font-weight: 800;
            padding: 0.15rem 0.55rem;
            border-radius: 4px;
            font-size: 0.7rem;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            flex-shrink: 0;
        }
        .ticker-container {
            overflow-x: auto;
            white-space: nowrap;
            flex: 1;
            position: relative;
            scroll-behavior: smooth;
        }
        .ticker-container::-webkit-scrollbar { height: 5px; }
        .ticker-container::-webkit-scrollbar-thumb { background: var(--primary-color); border-radius: 4px; }
        .ticker-track { display: inline-flex; gap: 2.5rem; align-items: center; }
        .ticker-item {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: 600;
            color: var(--text-main);
            background: var(--bg-card);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }
        .latest-alert-btn {
            background: var(--accent-blue);
            color: #fff;
            border: none;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .content-area {
            flex: 1;
            padding: 0.6rem;
            overflow-y: auto;
        }

        .page-section { display: none; }
        .page-section.active { display: block; }
        #globalSearchResultsSection.active { display: block; }

        .search-result-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.7rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.6rem;
        }
        .source-badge {
            background: rgba(245, 158, 11, 0.2);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .page-local-search { margin-bottom: 0.4rem; position: relative; }
        .page-local-search input {
            width: 100%;
            padding: 0.3rem 2rem 0.3rem 0.6rem;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-main);
            outline: none;
            font-size: 0.78rem;
        }
        .page-local-search i { position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .btn {
            background-color: var(--primary-color);
            color: #000;
            font-weight: 700;
            border: none;
            padding: 0.3rem 0.6rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.76rem;
        }
        .btn-green { background-color: var(--accent-green); color: #fff; }
        .btn-blue { background-color: var(--accent-blue); color: #fff; }
        .btn-danger { background-color: var(--danger-color); color: #fff; }
        .btn-secondary { background-color: var(--bg-surface); color: var(--text-main); border: 1px solid var(--border-color); }

        .split-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; align-items: start; }
        .branch-box {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 0.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        .branch-title {
            font-size: 0.88rem;
            font-weight: 700;
            padding-bottom: 0.3rem;
            margin-bottom: 0.4rem;
            border-bottom: 2px solid var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.7rem; table-layout: fixed; }
        th, td { padding: 0.4rem 0.3rem; border-bottom: 1px solid var(--border-color); text-align: right; line-height: 1.25; vertical-align: middle; overflow: hidden; text-overflow: ellipsis; cursor: text; }
        th { background-color: var(--bg-card); color: var(--text-muted); font-weight: 600; font-size: 0.72rem; }

        .highlight-pulse { animation: pulseGlow 1.5s infinite; }
        @keyframes pulseGlow {
            0% { background-color: rgba(245, 158, 11, 0.6); }
            50% { background-color: rgba(245, 158, 11, 0.1); }
            100% { background-color: rgba(245, 158, 11, 0.6); }
        }

        .alerts-2col-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem; }
        .alert-card-item-compact {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.4rem 0.6rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            font-size: 0.76rem;
        }
        .alert-thumb-side { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; cursor: pointer; border: 1px solid var(--border-color); }
        .pdf-file-badge { background: var(--danger-color); color: #fff; padding: 0.2rem 0.4rem; border-radius: 4px; font-size: 0.65rem; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 0.2rem; }

        .coordinators-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 0.4rem; 
            align-items: start; 
        }
        .doc-sheet-card {
            border-radius: 8px;
            padding: 0.5rem 0.6rem;
            color: #fff;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            font-size: 0.75rem;
            line-height: 1.3;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            position: relative;
        }
        .doc-sheet-card h3 {
            font-size: 0.82rem;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 0.2rem;
            margin-bottom: 0.1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card-drag-handle { cursor: grab; padding: 0.1rem 0.25rem; color: #facc15; font-size: 0.75rem; }
        .card-drag-handle:active { cursor: grabbing; }

        .card-teal { background-color: #0d47a1; }
        .card-maroon { background-color: #4a148c; }
        .card-red { background-color: #b71c1c; }
        .card-darkblue { background-color: #1a237e; }
        .card-gold { background-color: #e65100; }
        .card-green { background-color: #1b5e20; }

        .offers-tabs { display: flex; gap: 0.3rem; margin-bottom: 0.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.25rem; overflow-x: auto; }
        .offer-tab-btn {
            background: var(--bg-surface);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 0.3rem 0.7rem;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 600;
            font-size: 0.76rem;
        }
        .offer-tab-btn.active { background: var(--primary-color); color: #000; border-color: var(--primary-color); }

        .offers-table-box { background-color: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 0.6rem; }
        .price-badge { background-color: rgba(37, 99, 235, 0.25); color: var(--primary-color); padding: 0.2rem 0.6rem; border-radius: 6px; font-weight: 800; font-size: 0.88rem; display: inline-block; }
        .tag-joint { background: linear-gradient(45deg, #f59e0b, #d97706); color: #000; font-weight: 800; font-size: 0.55rem; padding: 0.02rem 0.2rem; border-radius: 3px; }

        .ai-floating-btn {
            position: fixed;
            bottom: 25px;
            left: 25px;
            width: 50px;
            height: 50px;
            background: #facc15;
            color: #1e1b4b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            z-index: 10000;

            transition: transform 0.2s;
        }
        .ai-floating-btn:hover { transform: scale(1.1); }

        .ai-floating-chat-window {
            position: fixed;
            bottom: 85px;
            left: 25px;
            width: 380px;
            height: 480px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            display: none;
            flex-direction: column;
            z-index: 10000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            overflow: hidden;
        }
        .ai-floating-chat-window.active { display: flex; }
        .ai-messages-box { flex: 1; padding: 0.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; }
        .ai-message { max-width: 92%; padding: 0.45rem 0.65rem; border-radius: 8px; font-size: 0.75rem; line-height: 1.4; }
        .ai-message.user { background: var(--accent-blue); color: #fff; align-self: flex-start; }
        .ai-message.gemini { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); align-self: flex-end; }
        .ai-input-box { padding: 0.35rem; background: var(--bg-card); border-top: 1px solid var(--border-color); display: flex; gap: 0.3rem; }
        .ai-input-box input {
            flex: 1;
            padding: 0.3rem 0.5rem;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-main);
            outline: none;
            font-size: 0.75rem;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 0.8rem;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            padding: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            overflow-y: auto;
        }
        .form-control {
            width: 100%;
            padding: 0.35rem;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-main);
            outline: none;
            font-size: 0.76rem;
        }

        .days-section-box { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; padding: 0.4rem; }
        .days-checklist { display: grid; grid-template-columns: 1fr 1fr; gap: 0.25rem; margin-top: 0.3rem; display: none; }
